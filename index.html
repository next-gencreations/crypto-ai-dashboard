<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crypto AI Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background:#0b0b0f; color:#eee; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .card { background:#151521; border:1px solid #2a2a40; border-radius:12px; padding:12px; min-width:280px; flex:1; }
    h1 { margin:0 0 12px 0; font-size:20px; }
    h2 { margin:0 0 8px 0; font-size:16px; color:#cfcfff; }
    pre { white-space:pre-wrap; word-break:break-word; background:#0f0f18; padding:10px; border-radius:10px; border:1px solid #2a2a40; }
    .small { opacity:0.8; font-size:12px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #2a2a40; padding:6px; font-size:12px; text-align:left; }
    button { background:#6d4aff; color:#fff; border:0; padding:10px 12px; border-radius:10px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>Crypto AI Dashboard</h1>
  <div class="small">API: <span id="apiUrlLabel"></span></div>
  <br/>
  <button onclick="loadData()">Refresh</button>
  <span class="small" id="status"></span>

  <br/><br/>

  <div class="row">
    <div class="card">
      <h2>Pet</h2>
      <pre id="pet"></pre>
    </div>

    <div class="card">
      <h2>Stats</h2>
      <pre id="stats"></pre>
    </div>

    <div class="card">
      <h2>Prices</h2>
      <pre id="prices"></pre>
    </div>
  </div>

  <br/>

  <div class="row">
    <div class="card">
      <h2>Equity (latest)</h2>
      <pre id="equity"></pre>
    </div>

    <div class="card">
      <h2>Trades (latest 20)</h2>
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Market</th><th>Side</th><th>Size</th><th>PNL</th><th>Reason</th>
          </tr>
        </thead>
        <tbody id="trades"></tbody>
      </table>
    </div>
  </div>

<script>
  // ✅ Put your real API base here
  const API_BASE = "https://crypto-ai-api-1-7cte.onrender.com";
  document.getElementById("apiUrlLabel").textContent = API_BASE + "/data";

  function fmt(obj) {
    return JSON.stringify(obj, null, 2);
  }

  async function loadData() {
    const status = document.getElementById("status");
    status.textContent = " loading...";
    try {
      const res = await fetch(API_BASE + "/data", { cache: "no-store" });
      const data = await res.json();

      document.getElementById("pet").textContent = fmt(data.pet || {});
      document.getElementById("stats").textContent = fmt(data.stats || {});
      document.getElementById("prices").textContent = fmt(data.prices || {});

      const eq = (data.equity && data.equity.length) ? data.equity[data.equity.length - 1] : null;
      document.getElementById("equity").textContent = fmt(eq || {});

      const rows = (data.trades || []).slice(-20).reverse().map(t => `
        <tr>
          <td>${(t.time_utc || "").replace("T"," ").replace("+00:00","")}</td>
          <td>${t.market || ""}</td>
          <td>${t.side || ""}</td>
          <td>${t.size_usd ?? ""}</td>
          <td>${t.pnl_usd ?? ""}</td>
          <td>${t.reason || ""}</td>
        </tr>
      `).join("");
      document.getElementById("trades").innerHTML = rows;

      status.textContent = " ✅ updated";
    } catch (e) {
      status.textContent = " ❌ error: " + e.message;
    }
  }

  loadData();
  setInterval(loadData, 15000); // auto refresh every 15s
</script>
</body>
</html>
